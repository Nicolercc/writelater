name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Install, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to commit SHAs; the comment shows the release.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Reads the pnpm version from "packageManager" in package.json.
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Same command Vercel uses, so a lockfile drift fails here first.
      - run: pnpm install --frozen-lockfile

      - run: pnpm run typecheck

      - run: pnpm --filter @workspace/writelater run lint

      - run: pnpm --filter @workspace/writelater run test

      - run: pnpm --filter @workspace/writelater run build

  e2e:
    name: End-to-end (Chromium, WebKit iPhone)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Browser builds matching the pinned @playwright/test, plus Linux deps.
      - run: pnpm --filter @workspace/writelater exec playwright install --with-deps chromium webkit

      # Builds production output, serves it with vite preview, runs both engines.
      - run: pnpm --filter @workspace/writelater run test:e2e

      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-traces
          path: artifacts/writelater/test-results/
          retention-days: 7
